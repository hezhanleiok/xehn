name: Build Android APK

on:
  push:
    branches:
      - xehn-android
    paths:
      - "app/**"
      - "engine/**"
      - "tools/build-engine.ps1"
      - "tools/build-apk.ps1"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26.8
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache-dependency-path: engine/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pin a published command-line tools package instead of the broken
          # commandlinetools-win-latest_latest.zip alias (HTTP 404).
          cmdline-tools-version: "11076708"
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Configure Android and Go environment
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw "Android SDK path was not provided by setup-android" }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_NDK_HOME=$sdk\ndk\27.0.12077973" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOTOOLCHAIN=go1.26.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Go engine AAR
        shell: pwsh
        run: ./tools/build-engine.ps1

      - name: Build debug APK
        shell: pwsh
        run: ./gradlew.bat --no-daemon --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xehn-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
